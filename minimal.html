<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>so_long</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: rgb(1, 64, 64);
            overflow: hidden;
        }

        canvas { image-rendering: pixelated }
    </style>
</head>

<body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    <script type='text/javascript'>
        let gameStarted = false;
        const gameWindowWidth = 640;
        const gameWindowHeight = 480;
        const canvas = document.getElementById('canvas');
        const strechCanvasToWindow = () => {
            if (!gameStarted) return;

            console.log('Resizing canvas to fit window');
            const windowWidth = Math.max(window.innerWidth || gameWindowWidth, gameWindowWidth / 2);
            const windowHeight = Math.max(window.innerHeight || gameWindowHeight, gameWindowHeight / 2);
            const scaleX = Math.max(windowWidth / gameWindowWidth, 0.1);
            const scaleY = Math.max(windowHeight / gameWindowHeight, 0.1);
            const scale = Math.min(scaleX, scaleY);
            canvas.style.transform = `scale(${scale})`;
            canvas.style.transformOrigin = 'center';
            canvas.style.position = 'absolute';
        };

        window.addEventListener('resize', strechCanvasToWindow);
        window.addEventListener('orientationchange', strechCanvasToWindow);
        window.addEventListener('load', strechCanvasToWindow);

        var Module = {
            canvas: (function () { return document.getElementById('canvas'); })(),
            onRuntimeInitialized: function () {
                console.log('Emscripten runtime initialized');
                gameStarted = true;
                strechCanvasToWindow();
            }
        };
    </script>
    {{{ SCRIPT }}}
</body>

</html>
