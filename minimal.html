<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>so_long</title>
    <style>
        /* Estilo para o corpo da página */
        body { 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background: black; 
            overflow: hidden; /* Impede barras de rolagem */
        }
    </style>
</head>
<body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    <script type='text/javascript'>
        let gameStarted = false;
        var Module = {
            canvas: (function() { return document.getElementById('canvas'); })(),
            onRuntimeInitialized: function() {
                console.log('Emscripten runtime initialized');
                gameStarted = true;
                strechCanvasToWindow();
            }
        };
    </script>
    {{{ SCRIPT }}}
    <script type='text/javascript'>
        const gameWindowHeight = 480;
        const gameWindowWidth = 640;
        const canvas = document.getElementById('canvas');
        const strechCanvasToWindow = () => {
            if (!gameStarted) return;

            const scaleX = window.innerWidth / gameWindowWidth;
            const scaleY = window.innerHeight / gameWindowHeight;
            canvas.style.scale = scaleX + ' ' + scaleY;
            canvas.style.position = 'absolute';
            canvas.style.left = (window.innerWidth - gameWindowWidth) / 2 + 'px';
            canvas.style.top = (window.innerHeight - gameWindowHeight) / 2 + 'px';
        };

        window.addEventListener('resize', strechCanvasToWindow);
        window.addEventListener('orientationchange', strechCanvasToWindow);
        window.addEventListener('load', strechCanvasToWindow);
    </script>
</body>
</html>
